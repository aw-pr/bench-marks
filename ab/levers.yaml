# Lever registry for the A/B harness.
#
# Each lever names a thing TOKEN-SPEND-TODO.md claims will cut spend or
# spin-up. A lever is testable only when its machinery is present; bin/preflight.sh
# enforces that and refuses rather than warns, because an absent lever silently
# degrades its own treatment arm into the control arm.
#
# arms.control is always the do-nothing arm. Anything that differs between the
# two arms other than the named lever is a bug in the cell definition.

version: 1

levers:
  codegraph:
    todo_item: "1 / 1b"
    question: >
      Does querying a pre-built code graph reach a correct answer in fewer tool
      calls and less wall-clock than grep + Read, on a cold comprehension task?
    prior: >
      BENCH-006, n=1, scored a 27-27 rubric tie with a split verdict: codegraph
      won round-trips and completeness, grep/Read won token-frugality and
      failure-mode honesty. Never re-run with metering or repeats.
    arms:
      control:   { mcp: none }
      treatment: { mcp: codegraph }
    preflight:
      - binary: codegraph
      - mcp_responds: codegraph
      - index_newer_than_head: true
    status: RETIRED
    retired: 2026-08-23
    retired_reason: >
      Never measured, and now cannot be without deliberate re-adoption. Two
      independent breakages: engines node ">=20.0.0 <25.0.0" against installed
      26.5.0, and a global npm prefix inside a version-pinned Cellar path that
      the node upgrade took with it. Reinstalling costs a pinned node@20 plus a
      per-repo index that goes stale silently -- the fractals index was 39 files
      behind HEAD. Against that, BENCH-008 answered both harness tasks with
      plain Grep/Read in 1-15 tool calls, and BENCH-006's only prior evidence
      (n=1) was a rubric tie whose noted failure mode was confident wrong edges.
      All 40 .mcp.json registrations and the codegraph-first skill were removed.
      Kept in this registry rather than deleted: "lost the A/B" and "was never
      testable" are different findings, and only the second one is true here.
      Superseded by the ast_grep lever, which asks the same question with
      nothing to index.

  ast_grep:
    todo_item: "1 / 1b (replacement)"
    question: >
      Does a structural-search binary reach a correct answer in fewer tool calls
      than plain Grep + Read, without any index to build or keep fresh?
    prior: >
      Adopted 2026-08-23 as the low-hassle replacement for codegraph, on the
      argument that these repos are 3k-41k lines and BENCH-008 answered both
      tasks in 1-15 tool calls with no graph at all. That argument predicts a
      SMALL or ZERO win. This lever exists to check it rather than assume it --
      if ast-grep does not beat grep here, the correct conclusion is that no
      discovery tool is warranted at this repo size, which is itself the answer.
    arms:
      control:   { tool: grep_only }
      treatment: { tool: ast_grep_available }
    preflight:
      - binary: ast-grep
    status: INCONCLUSIVE
    ran: 2026-08-23
    result: >
      Ran twice at n=3, 12 cells each. Gate 6/6 in both arms both times. Not a measurement
      of ast-grep: instrumentation showed the treatment arm invoked grep 25
      times and ast-grep zero times across all six treatment cells, so both
      arms were grep-and-Read. The two runs disagree in sign (+11.8% then
      -21.7% on tool calls), which puts the harness noise floor at roughly
      +/-20% at n=3 over two tasks -- a constraint that applies to every other
      lever here. Naming a tool in --append-system-prompt does not reliably
      change tool selection; availability plus instruction is not adoption.
      To make it measurable, deny Bash(grep:*) in the treatment arm and accept
      that this asks a different question.
    note: >
      Neither arm needs an index, a daemon, or an MCP registration, so unlike
      codegraph this lever cannot silently degrade into its own control through
      a stale index. The control arm denies ast-grep at the tool layer rather
      than merely omitting it, because --allowedTools does not restrict.

  repo_priming:
    todo_item: "4"
    question: >
      Does a 20-30 line architecture map at the top of CLAUDE.md / AGENTS.md
      reduce the tool calls an agent spends orienting before it can act?
    prior: none
    arms:
      control:   { priming: absent }
      treatment: { priming: present }
    preflight:
      - fixture_pair: true
    status: REFUTED (as stated)
    ran: 2026-09-18 (twice; the first run is void)
    result: >
      Valid run: 20 cells, gate 10/10 in both arms, and the map is a COST.
      Cost +20.8%, wall-clock +18.6%, cache reads +33.7%, tool calls flat
      (T1 9->10, T2 2->2). Both tasks move the same direction by similar
      amounts on cost and wall-clock. The mechanism is plain: the map is prompt weight paid for
      every turn, and it bought no fewer round trips. Magnitude sits on the
      +/-20% noise floor so do not quote it; the direction is what holds.
      The first run reported -34.0% cost and was written up as validating the
      hypothesis. It measured recall, not orientation: T1's priming named all
      four of that task's answer-key terms and described how they connect, and
      T2's named two of three plus the dependency the task asks for. The maps
      also differed in kind and length between tasks, so the arms were not
      comparable across tasks either. Void run kept as
      runs/repo_priming.void-answer-in-priming.jsonl.
      Scope: two tasks, one repository, conventional layout, both questions
      answerable by a few greps. A map may still earn its place where layout is
      not guessable. What is refuted is the general claim that a map is a cheap
      win worth adding everywhere.
    guard: >
      preflight refuses this lever if any priming block names one of its task's
      answer-key terms. Run against the fixtures it replaces, it refuses both.

  subagent_hygiene:
    todo_item: "5"
    question: >
      Does instructing an explore sub-agent to return conclusions rather than
      file contents reduce parent-context tokens without losing correctness?
    prior: none
    arms:
      control:   { subagent_prompt: dump }
      treatment: { subagent_prompt: conclusions }
    tasks:
      - T3-go-package-types
      - T4-swift-declared-types
    metric: parent_input_tokens
    preflight:
      - fixture_pair: true
    status: INCONCLUSIVE
    ran: 2026-09-18 (twice; the first run is void)
    result: >
      Valid run: 20 cells over two fan-out tasks, gate 10/10 in both arms, every
      metric inside the noise floor with four of six disagreeing in sign between
      tasks. The reason is the finding: subagent_stats.spawned is 0 in all 20
      cells. Agent and Task were allowed, both tasks need breadth across 57 Go
      and 17 Swift files, and the treatment arm was told how to brief a
      sub-agent. Opus 5 delegated zero times and used Bash throughout, so the
      instruction was inert and the arms were identical.
      This is the third time this harness has shown that availability plus
      instruction is not adoption (see ast_grep, and codegraph's skill). A lever
      whose treatment is "the model should prefer X" cannot be measured by
      prompt-level A/B; measuring it means removing the alternative, which asks
      a different question.
      The first run is void, not a result: Agent and Task were in
      disallowed_tools on BOTH arms, so the lever could not fire at all. It
      returned -4.2% and the write-up explained that null as a corpus property.
      Kept as runs/subagent_hygiene.void-agent-disallowed.jsonl.

  model_tier:
    todo_item: "3"
    question: >
      On a given task class, which is the cheapest tier that still passes the
      answer-key gate? This is the per-task-type routing guide item 3 leaves open.
    prior: >
      BENCH-007 found Fable 30/30 and Opus 30/30 on an O(1) LFU cache kernel --
      the rubric saturated, which is evidence the quality dimension does not
      discriminate here and cost is the only live variable.
    arms:
      control:   { model: claude-opus-5 }
      treatment: { model: claude-sonnet-5 }
    preflight:
      - model_reachable: true
    status: RUN
    ran: 2026-08-23
    result: >
      12 cells (2 tasks x 2 arms x n=3). Gate 6/6 in both arms, so no quality
      separation. Sonnet 5 took 40% fewer tool calls and cost 71.6% less, and
      the delta held across both task shapes. Well clear of the +/-20% noise
      floor. Wrote the routing guide's first row: cold repository comprehension
      and dependency lookup route to Sonnet. See RESULTS.md and BENCH-008.
    note: >
      The Haiku arm this entry once carried as extra_arms was never runnable --
      run-grid.sh and run-cell.sh both take exactly control and treatment, so an
      extra_arms key was inert documentation. Split into model_tier_haiku below,
      paired against Sonnet rather than Opus because the open question is
      whether the guide gets a row BELOW its current recommendation; re-pairing
      against Opus would only re-measure a delta this row already has.

  model_tier_haiku:
    todo_item: "3"
    question: >
      Does Haiku 4.5 still hold the answer-key gate on the task classes Sonnet 5
      passes, and at what saving? This is the next row down in the routing guide.
    prior: >
      model_tier found no quality separation between Opus 5 and Sonnet 5 on
      these two tasks -- the gate did not discriminate at all, which is why the
      cost delta was readable as real saving. Whether the gate starts to
      discriminate one tier lower is exactly what is unknown; a failed gate here
      is a useful result, not a wasted run.
    arms:
      control:   { model: claude-sonnet-5 }
      treatment: { model: claude-haiku-4-5-20251001 }
    preflight:
      - model_reachable: true
    status: RUN
    ran: 2026-09-18
    result: >
      20 cells (2 tasks x 2 arms x n=5). The gate discriminated for the first
      time in this harness: Sonnet 5 10/10, Haiku 4.5 7/10, and the failures are
      not spread evenly -- Haiku is 5/5 on the enumerative task and 2/5 on the
      narrative trace. Cost deltas deliberately omitted: efficiency is compared
      only over runs passing in both arms, so T1 drops to n=2 and any saving
      quoted from it would be averaging over exactly the cases where the cheap
      tier worked. On T2, where both arms passed 5/5 and the comparison is
      sound, Haiku is the MORE expensive arm: +75.8% cost and twice the tool
      calls. So no routing row: Haiku is wrong three times in five on one task
      and dearer on the other. Cold repository comprehension has now been
      measured down to Haiku and stops paying at Sonnet.

  prompt_cache:
    todo_item: "2"
    question: >
      Is the cacheable-prefix work actually landing -- what fraction of input
      tokens are cache reads, and does it hold across a session's turns?
    prior: >
      Banked in autometta (commits 9038385, 9fcbdc4) and instrumented, but never
      measured against a no-cache arm.
    arms:
      control:   { note: "not switchable from the CLI" }
      treatment: { note: "not switchable from the CLI" }
    preflight:
      - observational_only: true
    status: OBSERVATIONAL
    note: >
      The CLI gives no flag to disable prompt caching, so this cannot be a true
      A/B. It is measured observationally instead: cache_read_input_tokens over
      total input tokens, reported per run. Recorded here so the lever is not
      mistaken for untested when it is in fact untestable by this method.

  # --- Codex levers ----------------------------------------------------------
  # Same corpus, same gate, run through `codex exec --sandbox read-only` by
  # run-cell.sh's codex backend. A Plus subscription reports no USD, so the cost
  # metric is quota_pct_used: the share of the 5-hour window one answer took,
  # read from the run's own rollout. That is only clean with nothing else using
  # Codex, which is why these levers run overnight under bin/overnight.sh.
  # Not comparable with the Claude levers' tool_calls: Codex has one shell tool
  # where Claude has Read/Grep/Glob/Bash.

  codex_tier:
    todo_item: "3 (Codex)"
    question: >
      On cold repository comprehension, does Luna hold the answer-key gate that
      Terra holds, and at what share of the 5-hour window?
    prior: >
      None for Codex. On the Claude side the gate held one tier down (Opus to
      Sonnet) and broke two tiers down (Haiku failed the narrative trace 3/5).
    arms:
      control:   { model: gpt-5.6-terra, reasoning_effort: medium }
      treatment: { model: gpt-5.6-luna,  reasoning_effort: medium }
    preflight:
      - codex_model_reachable: true
    status: RUN
    ran: 2026-10-10 (overnight, harness acd529e)
    result: >
      40 cells (4 tasks x 2 arms x n=5), credits_spent 0 on every record. Gate
      Terra 19/20, Luna 18/20: no separation. Luna's two misses are both T4
      (HUDSnapshot left out of a fourteen-type file listing), inside the two-pass
      swing the same Terra arm showed on T1 across two runs that night. Luna
      drew 45% less of the 5-hour window (20 points to 11, summed over each
      arm's 20 cells; same direction on all four tasks) while spending MORE
      tokens: output +57.4%, reasoning +97.6%, tool calls +40.0%, the output
      and reasoning deltas agreeing in sign on all four tasks. Across models, fewer tokens is
      not less quota. 24 of the night's 80 Codex cells shared the window with
      another repo's codex exec worker; on the 27 codex_tier cells that ran
      alone the gap is wider (0.92 against 0.29 points a cell). Wrote the
      routing guide's first Codex row: comprehension routes to Luna at medium.
      See RESULTS.md and BENCH-009.

  codex_effort:
    todo_item: "3 (Codex)"
    question: >
      Does high reasoning effort buy any gate passes over medium on Terra, or
      only spend quota? high is the default in the local Codex config, so a
      null result changes a setting every Codex session pays for.
    prior: none
    arms:
      control:   { model: gpt-5.6-terra, reasoning_effort: high }
      treatment: { model: gpt-5.6-terra, reasoning_effort: medium }
    preflight:
      - codex_model_reachable: true
    status: INCONCLUSIVE
    ran: 2026-10-10/11 (overnight, harness acd529e)
    result: >
      40 cells, credits_spent 0. Gate high 20/20, medium 16/20: T1 2/5 at
      medium, every miss naming the precision type "fixed-point bignum" instead
      of BigFixed, and one T3 miss. Not a null, so the stated condition for
      changing the default was not met. Not a separation either: the identical
      Terra-medium configuration is codex_tier's control, run an hour earlier,
      and scored 19/20 with T1 4/5. Pooled, medium is 35/40 against 20/20,
      about a one-in-eight chance split if the arms were identical. Over T2-T4
      (T1 excluded, medium n=2) medium drew 41% less of the window (17 points
      to 10) and 35.2% fewer reasoning tokens, same sign on all three tasks.
      high stays the default. To settle it: n=10 per arm on T1 alone, 20
      cells, which is where the whole difference sits.

  # --- Context hygiene -------------------------------------------------------
  # TOKEN-SPEND-TODO item 6, split in two because the harness takes exactly two
  # arms per lever. Both levers share one control: the operator's MCP setup
  # exactly as a headless `claude -p` loads it, with tool search (deferred tool
  # schemas) at its default. The two controls are the same configuration, so
  # comparing them is a free A/A check on the noise floor.

  mcp_prune:
    todo_item: "6 (prune MCP servers per session)"
    question: >
      With the operator's normal MCP servers loaded and tool search at its
      default, does --strict-mcp-config with no servers cut the cost of the
      same correct answer?
    prior: >
      TOKEN-SPEND-TODO item 6 asserts that each connected server's tool schemas
      cost context before any work starts. repo_priming found that adding a
      32-line map the task did not need cost about a fifth more, so removing
      unused prompt weight might be the same effect with the sign reversed.
      Against that, current Claude Code defers MCP schemas behind ToolSearch, so
      the lever may already be banked.
    arms:
      control:   { mcp: operator default, tool_search: default }
      treatment: { mcp: none (--strict-mcp-config), tool_search: default }
    model: claude-sonnet-5-5
    tasks:
      - T1-orbit-trace
      - T2-viewport-consumers
    preflight:
      - context_arms_differ: true
    status: BANKED (by default tool search)
    ran: 2026-11-15 (harness 496c026, Claude Code 2.1.325)
    result: >
      20 cells, gate 9/10 default against 10/10 pruned. Tool search was on, so
      the 24 MCP tools were listed by name only: pruning removed 515 tokens
      from every turn's prompt (-1.8%, identical in every cell). On T2, where
      both arms took one Grep and two turns every time, that is exactly what it
      saved: 1,030 cache-read tokens and 1.2% of cost. The headline +16.2% cost
      is T1 behaviour (one more tool call at the median); the two identical
      controls swing that much on T1 between themselves. Fully loaded the same
      24 schemas cost 5,867 tokens a turn, so tool search already removes 91%
      of what this lever was meant to remove. Not worth doing for spend while
      tool search is on.

  tool_deferral:
    todo_item: "6 (prefer deferred tool loading)"
    question: >
      What does deferred tool loading save on the same tasks, i.e. what would
      they cost with every tool schema loaded up front?
    prior: >
      Tool search is on by default in headless runs on this CLI (2.1.325), so
      control is the deferred regime and the treatment turns it off with
      ENABLE_TOOL_SEARCH=false for the one process, without touching any
      settings file.
    arms:
      control:   { mcp: operator default, tool_search: default }
      treatment: { mcp: operator default, tool_search: "off (ENABLE_TOOL_SEARCH=false)" }
    model: claude-sonnet-5-5
    tasks:
      - T1-orbit-trace
      - T2-viewport-consumers
    preflight:
      - context_arms_differ: true
    status: RUN
    ran: 2026-11-15 (harness 496c026, Claude Code 2.1.325)
    result: >
      20 cells, gate 10/10 in both arms. Turning deferral off adds 20,558
      tokens (+70.2%) to every turn's prompt: 15,206 for Claude Code's own
      deferrable tools and 5,352 for the 24 MCP schemas, net of the 515 their
      deferred listing already costs. Cost +16.9%
      at the headline and the same sign on both tasks: T2, behaviourally
      identical in every cell, +42.1%; T1, diluted by more turns, +14.1%.
      Cache reads +67.8%. Deferral is the default and is what already banks
      item 6. The action is negative: never set ENABLE_TOOL_SEARCH=false, and
      treat a harness that cannot defer as the place pruning still pays.
