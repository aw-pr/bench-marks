# Lever registry for the A/B harness.
#
# Each lever names a thing TOKEN-SPEND-TODO.md claims will cut spend or
# spin-up. A lever is testable only when its machinery is present; bin/preflight.sh
# enforces that and refuses rather than warns, because an absent lever silently
# degrades its own treatment arm into the control arm.
#
# arms.control is always the do-nothing arm. Anything that differs between the
# two arms other than the named lever is a bug in the cell definition.

version: 1

levers:
  codegraph:
    todo_item: "1 / 1b"
    question: >
      Does querying a pre-built code graph reach a correct answer in fewer tool
      calls and less wall-clock than grep + Read, on a cold comprehension task?
    prior: >
      BENCH-006, n=1, scored a 27-27 rubric tie with a split verdict: codegraph
      won round-trips and completeness, grep/Read won token-frugality and
      failure-mode honesty. Never re-run with metering or repeats.
    arms:
      control:   { mcp: none }
      treatment: { mcp: codegraph }
    preflight:
      - binary: codegraph
      - mcp_responds: codegraph
      - index_newer_than_head: true
    status: RETIRED
    retired: 2026-08-23
    retired_reason: >
      Never measured, and now cannot be without deliberate re-adoption. Two
      independent breakages: engines node ">=20.0.0 <25.0.0" against installed
      26.5.0, and a global npm prefix inside a version-pinned Cellar path that
      the node upgrade took with it. Reinstalling costs a pinned node@20 plus a
      per-repo index that goes stale silently -- the fractals index was 39 files
      behind HEAD. Against that, BENCH-008 answered both harness tasks with
      plain Grep/Read in 1-7 tool calls, and BENCH-006's only prior evidence
      (n=1) was a rubric tie whose noted failure mode was confident wrong edges.
      All 40 .mcp.json registrations and the codegraph-first skill were removed.
      Kept in this registry rather than deleted: "lost the A/B" and "was never
      testable" are different findings, and only the second one is true here.
      Superseded by the ast_grep lever, which asks the same question with
      nothing to index.

  ast_grep:
    todo_item: "1 / 1b (replacement)"
    question: >
      Does a structural-search binary reach a correct answer in fewer tool calls
      than plain Grep + Read, without any index to build or keep fresh?
    prior: >
      Adopted 2026-08-23 as the low-hassle replacement for codegraph, on the
      argument that these repos are 3k-41k lines and BENCH-008 answered both
      tasks in 1-7 tool calls with no graph at all. That argument predicts a
      SMALL or ZERO win. This lever exists to check it rather than assume it --
      if ast-grep does not beat grep here, the correct conclusion is that no
      discovery tool is warranted at this repo size, which is itself the answer.
    arms:
      control:   { tool: grep_only }
      treatment: { tool: ast_grep_available }
    preflight:
      - binary: ast-grep
    status: INCONCLUSIVE
    ran: 2026-08-23
    result: >
      Ran twice at n=3. Gate 12/12 in both arms both times. Not a measurement
      of ast-grep: instrumentation showed the treatment arm invoked grep 25
      times and ast-grep zero times across all six treatment cells, so both
      arms were grep-and-Read. The two runs disagree in sign (+11.8% then
      -21.7% on tool calls), which puts the harness noise floor at roughly
      +/-20% at n=3 over two tasks -- a constraint that applies to every other
      lever here. Naming a tool in --append-system-prompt does not reliably
      change tool selection; availability plus instruction is not adoption.
      To make it measurable, deny Bash(grep:*) in the treatment arm and accept
      that this asks a different question.
    note: >
      Neither arm needs an index, a daemon, or an MCP registration, so unlike
      codegraph this lever cannot silently degrade into its own control through
      a stale index. The control arm denies ast-grep at the tool layer rather
      than merely omitting it, because --allowedTools does not restrict.

  repo_priming:
    todo_item: "4"
    question: >
      Does a 20-30 line architecture map at the top of CLAUDE.md / AGENTS.md
      reduce the tool calls an agent spends orienting before it can act?
    prior: none
    arms:
      control:   { priming: absent }
      treatment: { priming: present }
    preflight:
      - fixture_pair: true
    status: PARTIAL
    ran: 2026-09-18
    result: >
      20 cells (2 tasks x 2 arms x n=5). Gate 10/10 in both arms. The headline
      reads -36.8% tool calls and -34.0% cost, but the whole effect is T1
      (-43.8% / -39.9%); T2 is flat on tool calls and worse on cost, wall-clock
      and output tokens, and the two tasks disagree in sign on four of six
      metrics. The aggregate looks uniform only because analyse.py compares
      arm-level medians and T1 is an order of magnitude larger.
      Two caveats decide how far this generalises. The fixtures are a 6-line and
      a 4-line map, not the 20-30 line architecture map the hypothesis
      describes; and T1's map names four of that task's five answer-key terms
      near-verbatim, which is closer to putting the answer in the system prompt
      than to orienting an agent. T2's map names no answer-key term and moved
      nothing.
      Honest claim: naming the relevant files in the prompt cuts the cost of
      finding them. Whether a generic architecture map helps is untested. Needs
      fixtures of comparable length for both tasks, naming structure rather than
      answer-key terms, before it can be called validated.

  subagent_hygiene:
    todo_item: "5"
    question: >
      Does instructing an explore sub-agent to return conclusions rather than
      file contents reduce parent-context tokens without losing correctness?
    prior: none
    arms:
      control:   { subagent_prompt: dump }
      treatment: { subagent_prompt: conclusions }
    tasks:
      - T3-go-package-types
      - T4-swift-declared-types
    metric: parent_input_tokens
    preflight:
      - fixture_pair: true
    status: INCONCLUSIVE
    ran: 2026-09-18 (twice; the first run is void)
    result: >
      Valid run: 20 cells over two fan-out tasks, gate 10/10 in both arms, every
      metric inside the noise floor with four of six disagreeing in sign between
      tasks. The reason is the finding: subagent_stats.spawned is 0 in all 20
      cells. Agent and Task were allowed, both tasks need breadth across 57 Go
      and 17 Swift files, and the treatment arm was told how to brief a
      sub-agent. Opus 5 delegated zero times and used Bash throughout, so the
      instruction was inert and the arms were identical.
      This is the third time this harness has shown that availability plus
      instruction is not adoption (see ast_grep, and codegraph's skill). A lever
      whose treatment is "the model should prefer X" cannot be measured by
      prompt-level A/B; measuring it means removing the alternative, which asks
      a different question.
      The first run is void, not a result: Agent and Task were in
      disallowed_tools on BOTH arms, so the lever could not fire at all. It
      returned -4.2% and the write-up explained that null as a corpus property.
      Kept as runs/subagent_hygiene.void-agent-disallowed.jsonl.

  model_tier:
    todo_item: "3"
    question: >
      On a given task class, which is the cheapest tier that still passes the
      answer-key gate? This is the per-task-type routing guide item 3 leaves open.
    prior: >
      BENCH-007 found Fable 30/30 and Opus 30/30 on an O(1) LFU cache kernel --
      the rubric saturated, which is evidence the quality dimension does not
      discriminate here and cost is the only live variable.
    arms:
      control:   { model: claude-opus-5 }
      treatment: { model: claude-sonnet-5 }
    preflight:
      - model_reachable: true
    status: RUN
    ran: 2026-08-23
    result: >
      12 cells (2 tasks x 2 arms x n=3). Gate 6/6 in both arms, so no quality
      separation. Sonnet 5 took 40% fewer tool calls and cost 71.6% less, and
      the delta held across both task shapes. Well clear of the +/-20% noise
      floor. Wrote the routing guide's first row: cold repository comprehension
      and dependency lookup route to Sonnet. See RESULTS.md and BENCH-008.
    note: >
      The Haiku arm this entry once carried as extra_arms was never runnable --
      run-grid.sh and run-cell.sh both take exactly control and treatment, so an
      extra_arms key was inert documentation. Split into model_tier_haiku below,
      paired against Sonnet rather than Opus because the open question is
      whether the guide gets a row BELOW its current recommendation; re-pairing
      against Opus would only re-measure a delta this row already has.

  model_tier_haiku:
    todo_item: "3"
    question: >
      Does Haiku 4.5 still hold the answer-key gate on the task classes Sonnet 5
      passes, and at what saving? This is the next row down in the routing guide.
    prior: >
      model_tier found no quality separation between Opus 5 and Sonnet 5 on
      these two tasks -- the gate did not discriminate at all, which is why the
      cost delta was readable as real saving. Whether the gate starts to
      discriminate one tier lower is exactly what is unknown; a failed gate here
      is a useful result, not a wasted run.
    arms:
      control:   { model: claude-sonnet-5 }
      treatment: { model: claude-haiku-4-5-20251001 }
    preflight:
      - model_reachable: true
    status: RUN
    ran: 2026-09-18
    result: >
      20 cells (2 tasks x 2 arms x n=5). The gate discriminated for the first
      time in this harness: Sonnet 5 10/10, Haiku 4.5 7/10, and the failures are
      not spread evenly -- Haiku is 5/5 on the enumerative task and 2/5 on the
      narrative trace. Cost deltas deliberately omitted: efficiency is compared
      only over runs passing in both arms, so T1 drops to n=2 and any saving
      quoted from it would be averaging over exactly the cases where the cheap
      tier worked. On T2, where both arms passed 5/5 and the comparison is
      sound, Haiku is the MORE expensive arm: +75.6% cost and twice the tool
      calls. So no routing row: Haiku is wrong three times in five on one task
      and dearer on the other. Cold repository comprehension has now been
      measured down to Haiku and stops paying at Sonnet.

  prompt_cache:
    todo_item: "2"
    question: >
      Is the cacheable-prefix work actually landing -- what fraction of input
      tokens are cache reads, and does it hold across a session's turns?
    prior: >
      Banked in autometta (commits 9038385, 9fcbdc4) and instrumented, but never
      measured against a no-cache arm.
    arms:
      control:   { note: "not switchable from the CLI" }
      treatment: { note: "not switchable from the CLI" }
    preflight:
      - observational_only: true
    status: OBSERVATIONAL
    note: >
      The CLI gives no flag to disable prompt caching, so this cannot be a true
      A/B. It is measured observationally instead: cache_read_input_tokens over
      total input tokens, reported per run. Recorded here so the lever is not
      mistaken for untested when it is in fact untestable by this method.
