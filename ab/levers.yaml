# Lever registry for the A/B harness.
#
# Each lever names a thing TOKEN-SPEND-TODO.md claims will cut spend or
# spin-up. A lever is testable only when its machinery is present; bin/preflight.sh
# enforces that and refuses rather than warns, because an absent lever silently
# degrades its own treatment arm into the control arm.
#
# arms.control is always the do-nothing arm. Anything that differs between the
# two arms other than the named lever is a bug in the cell definition.

version: 1

levers:
  codegraph:
    todo_item: "1 / 1b"
    question: >
      Does querying a pre-built code graph reach a correct answer in fewer tool
      calls and less wall-clock than grep + Read, on a cold comprehension task?
    prior: >
      BENCH-006, n=1, scored a 27-27 rubric tie with a split verdict: codegraph
      won round-trips and completeness, grep/Read won token-frugality and
      failure-mode honesty. Never re-run with metering or repeats.
    arms:
      control:   { mcp: none }
      treatment: { mcp: codegraph }
    preflight:
      - binary: codegraph
      - mcp_responds: codegraph
      - index_newer_than_head: true
    status: RETIRED
    retired: 2026-08-23
    retired_reason: >
      Never measured, and now cannot be without deliberate re-adoption. Two
      independent breakages: engines node ">=20.0.0 <25.0.0" against installed
      26.5.0, and a global npm prefix inside a version-pinned Cellar path that
      the node upgrade took with it. Reinstalling costs a pinned node@20 plus a
      per-repo index that goes stale silently -- the fractals index was 39 files
      behind HEAD. Against that, BENCH-008 answered both harness tasks with
      plain Grep/Read in 1-7 tool calls, and BENCH-006's only prior evidence
      (n=1) was a rubric tie whose noted failure mode was confident wrong edges.
      All 40 .mcp.json registrations and the codegraph-first skill were removed.
      Kept in this registry rather than deleted: "lost the A/B" and "was never
      testable" are different findings, and only the second one is true here.
      Superseded by the ast_grep lever, which asks the same question with
      nothing to index.

  ast_grep:
    todo_item: "1 / 1b (replacement)"
    question: >
      Does a structural-search binary reach a correct answer in fewer tool calls
      than plain Grep + Read, without any index to build or keep fresh?
    prior: >
      Adopted 2026-08-23 as the low-hassle replacement for codegraph, on the
      argument that these repos are 3k-41k lines and BENCH-008 answered both
      tasks in 1-7 tool calls with no graph at all. That argument predicts a
      SMALL or ZERO win. This lever exists to check it rather than assume it --
      if ast-grep does not beat grep here, the correct conclusion is that no
      discovery tool is warranted at this repo size, which is itself the answer.
    arms:
      control:   { tool: grep_only }
      treatment: { tool: ast_grep_available }
    preflight:
      - binary: ast-grep
    status: INCONCLUSIVE
    ran: 2026-08-23
    result: >
      Ran twice at n=3. Gate 12/12 in both arms both times. Not a measurement
      of ast-grep: instrumentation showed the treatment arm invoked grep 25
      times and ast-grep zero times across all six treatment cells, so both
      arms were grep-and-Read. The two runs disagree in sign (+11.8% then
      -21.7% on tool calls), which puts the harness noise floor at roughly
      +/-20% at n=3 over two tasks -- a constraint that applies to every other
      lever here. Naming a tool in --append-system-prompt does not reliably
      change tool selection; availability plus instruction is not adoption.
      To make it measurable, deny Bash(grep:*) in the treatment arm and accept
      that this asks a different question.
    note: >
      Neither arm needs an index, a daemon, or an MCP registration, so unlike
      codegraph this lever cannot silently degrade into its own control through
      a stale index. The control arm denies ast-grep at the tool layer rather
      than merely omitting it, because --allowedTools does not restrict.

  repo_priming:
    todo_item: "4"
    question: >
      Does a 20-30 line architecture map at the top of CLAUDE.md / AGENTS.md
      reduce the tool calls an agent spends orienting before it can act?
    prior: none
    arms:
      control:   { priming: absent }
      treatment: { priming: present }
    preflight:
      - fixture_pair: true
    status: READY

  subagent_hygiene:
    todo_item: "5"
    question: >
      Does instructing an explore sub-agent to return conclusions rather than
      file contents reduce parent-context tokens without losing correctness?
    prior: none
    arms:
      control:   { subagent_prompt: dump }
      treatment: { subagent_prompt: conclusions }
    preflight:
      - fixture_pair: true
    status: READY

  model_tier:
    todo_item: "3"
    question: >
      On a given task class, which is the cheapest tier that still passes the
      answer-key gate? This is the per-task-type routing guide item 3 leaves open.
    prior: >
      BENCH-007 found Fable 30/30 and Opus 30/30 on an O(1) LFU cache kernel --
      the rubric saturated, which is evidence the quality dimension does not
      discriminate here and cost is the only live variable.
    arms:
      control:   { model: claude-opus-5 }
      treatment: { model: claude-sonnet-5 }
    extra_arms:
      - { model: claude-haiku-4-5-20251001 }
    preflight:
      - model_reachable: true
    status: READY

  prompt_cache:
    todo_item: "2"
    question: >
      Is the cacheable-prefix work actually landing -- what fraction of input
      tokens are cache reads, and does it hold across a session's turns?
    prior: >
      Banked in autometta (commits 9038385, 9fcbdc4) and instrumented, but never
      measured against a no-cache arm.
    arms:
      control:   { note: "not switchable from the CLI" }
      treatment: { note: "not switchable from the CLI" }
    preflight:
      - observational_only: true
    status: OBSERVATIONAL
    note: >
      The CLI gives no flag to disable prompt caching, so this cannot be a true
      A/B. It is measured observationally instead: cache_read_input_tokens over
      total input tokens, reported per run. Recorded here so the lever is not
      mistaken for untested when it is in fact untestable by this method.
